<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#166534">
<title>SAMI Committee Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:linear-gradient(150deg,#edf8f0,#f8faf8);color:#17221b;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(500px,100%);background:#fff;border:1px solid #dce5df;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(20,40,24,.08)}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:#166534;color:#fff;display:grid;place-items:center;font-weight:900}.muted{color:#68736b}.notice{padding:12px;border:1px solid #ecd88d;background:#fff8e6;border-radius:13px;font-size:13px;margin-top:14px}.ok{padding:12px;border:1px solid #b9dfc3;background:#eef9f1;border-radius:13px;color:#155b2e;font-size:13px;margin-top:14px}.hidden{display:none!important}form{display:grid;gap:11px;margin-top:16px}label{font-size:13px;font-weight:750}input{width:100%;padding:11px 12px;border:1px solid #dce5df;border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;background:#166534;color:#fff;font-weight:750;cursor:pointer}.btn.alt{background:#eef2ef;color:#17221b;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">S</div><div><h2 style="margin:0">SAMI Committee Hub</h2><div class="muted">Secure authentication gateway</div></div></div>
  <div id="working" class="notice">Checking your SAMI sign-in link…</div>
  <div id="message" class="notice hidden"></div>
  <form id="recovery" class="hidden">
    <div class="ok">Your recovery link is valid. Choose a new password.</div>
    <div><label>New password</label><input id="p1" type="password" minlength="10" autocomplete="new-password" required></div>
    <div><label>Confirm new password</label><input id="p2" type="password" minlength="10" autocomplete="new-password" required></div>
    <button class="btn">Set new password</button>
  </form>
  <button id="openApp" class="btn alt hidden" onclick="location.href='./main.html'">Open SAMI Committee Hub</button>
</div>
<script>
const APP='./main.html';
const db=supabase.createClient('https://ztljgqyzunqnbfaviwgj.supabase.co','sb_publishable_UQ0f1KTsurvM8lG-t2GhFg_smKHh5Z0',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const query=new URLSearchParams(location.search);
const hasAuthParams=location.hash.includes('access_token=')||query.has('code')||hash.has('error_code')||query.has('error_code')||hash.has('error_description')||query.has('error_description');
let recoveryMode=false;
function showError(text){working.classList.add('hidden');message.textContent=text;message.classList.remove('hidden');openApp.classList.remove('hidden')}
function clean(){history.replaceState(null,'',location.pathname)}
const code=hash.get('error_code')||query.get('error_code')||'';
const desc=hash.get('error_description')||query.get('error_description')||'';
if(code||desc){
  const expired=code==='otp_expired'||/expired|invalid/i.test(desc);
  showError(expired?'This email link is invalid or has expired. Open the SAMI app and request a fresh link.':(desc||'Authentication could not be completed.'));
  clean();
}else if(!hasAuthParams){
  location.replace(APP);
}
db.auth.onAuthStateChange(async(event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    recoveryMode=true;working.classList.add('hidden');message.classList.add('hidden');recovery.classList.remove('hidden');clean();return;
  }
  if(event==='SIGNED_IN'&&session?.user&&!recoveryMode){
    clean();location.replace(APP);return;
  }
});
recovery.onsubmit=async e=>{
  e.preventDefault();
  if(p1.value!==p2.value)return showError('Passwords do not match. Please enter the same password twice.');
  const {error}=await db.auth.updateUser({password:p1.value});
  if(error)return showError(error.message);
  clean();working.textContent='Password changed successfully. Opening SAMI Committee Hub…';working.classList.remove('hidden');recovery.classList.add('hidden');
  location.replace(APP);
};
setTimeout(()=>{
  if(hasAuthParams&&!recoveryMode&&!message.classList.contains('hidden'))return;
  if(hasAuthParams&&!recoveryMode&&!recovery.classList.contains('hidden'))return;
},2500);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
