<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SAMI Committee Hub — Secure Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script>
<style>
:root{--g:#166534;--bg:#f5f8f6;--b:#dce5df;--m:#68736b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:#17221b;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--b);border-radius:16px;padding:18px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}input,button{width:100%;font:inherit;padding:11px;border-radius:10px}input{border:1px solid var(--b)}button{border:0;background:var(--g);color:#fff;font-weight:700;cursor:pointer}.muted{color:var(--m)}.status{display:none;margin-top:12px;padding:11px;border-radius:10px;background:#f7faf8;border:1px solid var(--b);white-space:pre-wrap}.status.show{display:block}.ok{background:#eefaf1;border-color:#b8dfc2}.err{background:#fff2f2;border-color:#edb8b8}form{display:grid;gap:10px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">S</div><div><h2 style="margin:0">SAMI Committee Hub</h2><div class="muted">Secure V9 sign in</div></div></div>
  <p class="muted">Use the email and password you created during committee activation.</p>
  <form id="loginForm" autocomplete="on">
    <input id="email" name="email" type="email" autocomplete="username" placeholder="Email" required>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <button id="submitBtn" type="submit">Sign in securely</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</div>
<script>
const SUPABASE_URL='https://ztljgqyzunqnbfaviwgj.supabase.co';
const SUPABASE_KEY='sb_publishable_UQ0f1KTsurvM8lG-t2GhFg_smKHh5Z0';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById('loginForm');
const email=document.getElementById('email');
const password=document.getElementById('password');
const submitBtn=document.getElementById('submitBtn');
const statusBox=document.getElementById('status');
function status(text,type=''){
  statusBox.className='status show '+type;
  statusBox.textContent=text;
}
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const userEmail=email.value.trim();
  if(!userEmail||!password.value){status('Enter your email and password.','err');return;}
  submitBtn.disabled=true;
  submitBtn.textContent='Signing in…';
  status('Contacting Supabase Auth…');
  try{
    const {data,error}=await client.auth.signInWithPassword({email:userEmail,password:password.value});
    if(error){status('Supabase sign-in error: '+error.message,'err');return;}
    if(!data?.session||!data?.user){status('Supabase did not return a valid session.','err');return;}
    status('Sign-in successful. Checking your SAMI committee profile…','ok');
    const {data:profile,error:profileError}=await client.from('profiles').select('id,full_name,role,is_active').eq('id',data.user.id).single();
    if(profileError||!profile){status('Signed in, but no SAMI committee profile was found.','err');await client.auth.signOut();return;}
    if(profile.is_active===false){status('Your SAMI committee account is inactive.','err');await client.auth.signOut();return;}
    status('Welcome '+profile.full_name+'. Opening your '+profile.role+' dashboard…','ok');
    setTimeout(()=>location.replace('./main.html?v=9'),500);
  }catch(err){status('Browser/network error: '+(err?.message||String(err)),'err');}
  finally{submitBtn.disabled=false;submitBtn.textContent='Sign in securely';}
});
</script>
</body>
</html>
